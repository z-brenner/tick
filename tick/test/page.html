<!doctype html>
<html lang="en" class="__THEME__" data-mode="__THEME__">
<head>
<meta charset="utf-8">
<title>Claude</title>
<style>
  html.light { --bg:#faf9f5; --fg:#141413; --muted:#73726c; --surface:#ffffff; --border:rgba(31,30,29,.15); --bubble:#f0eee6; }
  html.dark { --bg:#262624; --fg:#faf9f5; --muted:#a6a39b; --surface:#30302e; --border:rgba(222,220,209,.15); --bubble:#141413; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width:768px; margin:0 auto; padding:24px 16px 0; min-height:100vh; display:flex; flex-direction:column; }
  .msgs { flex:1; display:flex; flex-direction:column; gap:18px; padding-bottom:24px; }
  .u { align-self:flex-end; background:var(--bubble); padding:10px 14px; border-radius:14px; max-width:80%; }
  .a { font-family: ui-serif, Georgia, serif; font-size:16px; }
  .sticky { position:sticky; bottom:0; background:var(--bg); padding-bottom:14px; }
  .bg-surface-3 { background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 .25rem 1.25rem rgba(0,0,0,.035); padding:14px 14px 10px; }
  .relative.w-full.min-w-0 { position:relative; width:100%; }
  [data-testid="chat-input"] { min-height:44px; outline:none; color:var(--fg); }
  [data-testid="chat-input"]:empty::before { content:"Reply to Claude…"; color:var(--muted); }
  .tools { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .tools .sp { flex:1; }
  .btn { all:unset; font-size:13px; color:var(--muted); padding:4px 8px; border-radius:8px; cursor:pointer; border:1px solid var(--border); }
  .send { all:unset; width:32px; height:32px; border-radius:9px; background:#c6613f; color:white; display:grid; place-items:center; cursor:pointer; }
  .disclaimer { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="page">
  <div class="msgs">
    <div class="u">Can you tighten the indemnification clause in section 9 so it’s mutual?</div>
    <div class="a">Here’s a mutual version. Each party indemnifies the other for third-party claims arising from its own breach, negligence, or willful misconduct, subject to the cap in section 10 and the usual notice-and-control conditions…</div>
  </div>
  <div class="sticky" id="sticky">
    <div id="composer-root">
      <div class="composer">
        <div class="bg-surface-3">
          <div class="relative w-full min-w-0">
            <div data-testid="chat-input" class="ProseMirror" contenteditable="true" role="textbox"></div>
          </div>
          <div class="tools">
            <button class="btn">+</button>
            <span class="sp"></span>
            <button class="btn" data-testid="model-selector-dropdown" aria-label="Model: __MODEL__">__MODEL__</button>
            <button class="send" id="send" aria-label="Send">↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const ORG = '__ORG__';
  async function send() {
    const r = await fetch(`/api/organizations/${ORG}/chat_conversations/c0ffee/completion`, { method: 'POST', body: '{}' });
    const reader = r.body.getReader();
    while (!(await reader.read()).done) {}
  }
  document.getElementById('send').onclick = send;
  window.__send = send;
  // Simulate a SPA route change: the whole dock (and anything mounted in it) is thrown away.
  window.__rerender = () => {
    const dock = document.getElementById('sticky');
    const html = document.getElementById('composer-root').outerHTML;
    dock.innerHTML = '';
    setTimeout(() => { dock.innerHTML = html; document.getElementById('send').onclick = send; }, 400);
  };
</script>
</body>
</html>
